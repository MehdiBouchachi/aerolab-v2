# The host job runs the same commands as `make fw-test`. The ESP-IDF job proves the full image compiles and
# links for the esp32 target; it says nothing about behaviour on hardware (never flashed).
name: firmware
on:
  push: { paths: ["firmware/**", "contracts/**"] }
  pull_request: { paths: ["firmware/**", "contracts/**"] }
permissions: { contents: read }
jobs:
  host-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.work }
      - run: make fw-test
  idf-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3
    steps:
      - uses: actions/checkout@v4
      - run: cd firmware/esp32 && . $IDF_PATH/export.sh && idf.py set-target esp32 && idf.py build
