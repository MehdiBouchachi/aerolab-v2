# Production Mosquitto config for the Pi (drop-in: /etc/mosquitto/conf.d/aerolab.conf)
# STATUS: written from the spec, NOT yet validated on a Raspberry Pi.
#
# Credentials/ACL: one account per ESP32 (username == device_id) + the
# 'aerolab-edge' service account. Generate the ACL from this repo:
#   go run ./simulator/cmd/aerolab-seed  (dev)  or  mosquitto_passwd -c ... (production)
# The ACL file is the same static, %u-pattern file for any number of devices.
per_listener_settings true

listener 1883 0.0.0.0
# Plain MQTT is acceptable ONLY on the isolated site LAN of a pilot.
# Prefer TLS (listener 8883 + cafile/certfile/keyfile) once certificates exist;
# never forward 1883/8883 on the router.
allow_anonymous false
password_file /etc/mosquitto/aerolab.passwd
acl_file /etc/mosquitto/aerolab.acl

# Bounds (spec 9.9, 15.2)
max_packet_size 16384
max_connections 64
max_queued_messages 200
max_inflight_messages 20
memory_limit 67108864
persistence false
connection_messages false
log_type error
log_type warning
